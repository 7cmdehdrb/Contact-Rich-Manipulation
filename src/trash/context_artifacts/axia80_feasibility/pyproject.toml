[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "axia80-feasibility"
version = "0.1.0"
description = "Vectorized UR5e/Axia80 payload feasibility experiment for Isaac Lab"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "xacro", "matplotlib"]

[tool.setuptools.packages.find]
include = ["axia80_feasibility*"]

[tool.ruff]
line-length = 110

