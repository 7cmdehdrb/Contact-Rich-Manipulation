[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "surface-point"
version = "0.2.0"
description = "Orthographic visible-surface point and observed OBB comparison bench"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "observed-obb>=0.1.0", "scipy>=1.10", "warp-lang>=1.8", "Pillow>=9"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["surface_point*"]

[tool.pytest.ini_options]
pythonpath = [".", "../observed_obb"]
testpaths = ["tests"]
