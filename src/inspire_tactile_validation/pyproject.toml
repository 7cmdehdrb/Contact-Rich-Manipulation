[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "inspire-tactile-validation"
version = "0.1.0"
description = "Vectorized standalone physical probing of Inspire tactile channels"
requires-python = ">=3.10"
dependencies = ["torch", "inspire-sweep-baseline"]

[tool.setuptools.packages.find]
include = ["inspire_tactile_validation*"]
