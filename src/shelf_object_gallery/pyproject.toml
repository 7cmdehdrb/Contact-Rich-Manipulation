[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "shelf-object-gallery"
version = "0.1.0"
description = "Isaac Lab shelf display of the Final environment's procedural and YCB objects"
requires-python = ">=3.10"
dependencies = ["inspire-sweep-baseline"]

[tool.setuptools.packages.find]
include = ["shelf_object_gallery*"]
